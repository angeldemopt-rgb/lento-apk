name: Compilar APK de Lento

on:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle --no-daemon assembleDebug

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk Lento.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lento-apk
          path: Lento.apk

      # Cada compilación queda publicada; la última siempre en /releases/latest/download/Lento.apk
      - name: Publicar descarga
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lento (prueba ${{ github.run_number }})
          files: Lento.apk
          prerelease: false
          make_latest: true
