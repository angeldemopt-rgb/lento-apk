plugins {
    id "com.android.application"
}

android {
    namespace "es.postureo.lento"
    compileSdk 34

    defaultConfig {
        applicationId "es.postureo.lento"
        minSdk 24
        targetSdk 28  // Android 9: deja a una app normal conectarse a wifis (para pruebas)
        versionCode 2
        versionName "0.2-prueba"
    }

    lint { abortOnError false; checkReleaseBuilds false }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
