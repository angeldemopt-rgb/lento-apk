<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<title>Lento · mando</title>
<script src="app/src/main/assets/cuentos.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141a33;color:#f6efe2;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h3{font-family:Georgia,serif}
button,input{font:inherit;border:0}
button{cursor:pointer}
main{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px 150px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header h1{font-size:30px}
.pill{font-size:13px;padding:6px 12px;border-radius:999px;background:#2a3360;color:#aab3d6}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e57373;margin-right:6px}
.pill.ok i{background:#7bd88f}
.intro{color:#aab3d6;font-size:15px;margin-bottom:18px;line-height:1.45}
.t{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#232b52;color:#f6efe2;padding:14px;border-radius:20px;margin-bottom:12px}
.t .em{font-size:40px;width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.t h3{font-size:18px;margin:2px 0}
.t small{color:#aab3d6;font-size:12px}
.t.on{box-shadow:inset 0 0 0 2px #f3c969}
#barra{position:fixed;left:0;right:0;bottom:0;background:#1c2340;padding:14px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
#ahora{max-width:520px;margin:0 auto 10px;font-size:14px;color:#aab3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ahora b{color:#f6efe2}
.cs{max-width:520px;margin:0 auto;display:flex;gap:8px}
.c{flex:1;height:56px;border-radius:16px;background:#2a3360;color:#f6efe2;font-size:22px}
.c.p{background:#f6efe2;color:#1c2340}
#pedir{padding:40px 24px;text-align:center}
#pedir p{color:#aab3d6;margin:14px 0 22px;line-height:1.5}
#pedir input{width:200px;text-align:center;font-size:28px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;padding:14px;border-radius:16px}
#pedir button{display:block;margin:16px auto 0;background:#f6efe2;color:#1c2340;padding:16px 32px;border-radius:999px;font-weight:800}
</style>
</head>
<body>
<section id="pedir" style="display:none">
  <h1>Lento</h1>
  <p>Escanea el QR que sale en la pared, o escribe aquí el código de 6 letras:</p>
  <input id="codIn" maxlength="6" autocomplete="off">
  <button id="codOk">Conectar</button>
</section>
<main id="app" style="display:none">
  <header><h1>Lento</h1><span class="pill" id="conex"><i></i><span>Conectando…</span></span></header>
  <p class="intro">Elige un cuento y empezará en la pared. Luego puedes dejar el móvil boca abajo.</p>
  <div id="lista"></div>
</main>
<div id="barra" style="display:none">
  <div id="ahora">Nada sonando</div>
  <div class="cs">
    <button class="c" data-c="prev">⏮</button>
    <button class="c p" data-c="toggle" id="tg">▶︎</button>
    <button class="c" data-c="next">⏭</button>
    <button class="c" data-c="stop">⏹</button>
    <button class="c" data-c="luz" id="lz">🌙</button>
  </div>
</div>
<script>
var RELAY='https://ntfy.sh/';
function $(s){return document.querySelector(s);}
var codigo=(location.hash||'').replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'');
if(codigo.length!==6){
  $('#pedir').style.display='block';
  $('#codOk').onclick=function(){var v=$('#codIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length===6){location.hash=v;location.reload();}};
} else {
  arrancar();
}
function arrancar(){
  var CANAL='lento-'+codigo.toLowerCase()+'-k7';
  var v={cuento:null,pag:0,sonando:false,luz:false,seq:-1};
  var vivo=0;
  $('#app').style.display='block';$('#barra').style.display='block';
  function buscar(id){for(var i=0;i<CUENTOS.length;i++)if(CUENTOS[i].id===id)return CUENTOS[i];return null;}
  CUENTOS.forEach(function(c){
    var b=document.createElement('button');b.className='t';b.dataset.id=c.id;
    b.innerHTML='<span class="em" style="background:'+c.color+'33">'+c.em+'</span><span><small>'+c.tag.toUpperCase()+'</small><h3>'+c.titulo+'</h3><small>'+c.paginas.length+' láminas</small></span>';
    b.onclick=function(){mandar({cuento:c.id,pag:0,sonando:true,luz:false});};
    $('#lista').appendChild(b);
  });
  document.querySelectorAll('.c').forEach(function(b){b.onclick=function(){control(b.dataset.c);};});
  function control(k){
    var c=buscar(v.cuento);
    if(k==='luz')return mandar({cuento:v.cuento,pag:v.pag,sonando:v.sonando,luz:!v.luz});
    if(!c)return;
    if(k==='toggle')mandar({cuento:v.cuento,pag:v.pag,sonando:!v.sonando,luz:v.luz});
    if(k==='next')mandar({cuento:v.cuento,pag:Math.min(v.pag+1,c.paginas.length-1),sonando:v.sonando,luz:v.luz});
    if(k==='prev')mandar({cuento:v.cuento,pag:Math.max(v.pag-1,0),sonando:v.sonando,luz:v.luz});
    if(k==='stop')mandar({cuento:null,pag:0,sonando:false,luz:v.luz});
  }
  function mandar(o){
    v.cuento=o.cuento;v.pag=o.pag;v.sonando=o.sonando;v.luz=o.luz;pintar();
    fetch(RELAY+CANAL,{method:'POST',body:JSON.stringify(o)}).catch(function(){ok(false);});
  }
  function ok(b){var c=$('#conex');c.classList.toggle('ok',b);c.querySelector('span').textContent=b?'Proyector conectado':'Esperando al proyector…';}
  function pintar(){
    var c=buscar(v.cuento);
    document.querySelectorAll('.t').forEach(function(t){t.classList.toggle('on',t.dataset.id===v.cuento);});
    $('#ahora').innerHTML=c?'<b>'+c.titulo+'</b> · lámina '+(v.pag+1)+'/'+c.paginas.length+(v.sonando?'':' · en pausa'):'Nada sonando · código '+codigo;
    $('#tg').textContent=v.sonando?'⏸':'▶︎';
    $('#lz').textContent=v.luz?'☀️':'🌙';
  }
  // Escucha lo que dice el proyector (qué está sonando)
  var es=new EventSource(RELAY+CANAL+'-estado/sse?since=2m');
  es.onmessage=function(e){
    try{var ev=JSON.parse(e.data);if(ev.event!=='message')return;var s=JSON.parse(ev.message);
      vivo=Date.now();ok(true);
      if(typeof s.seq==='number'){v=s;pintar();}
    }catch(x){}
  };
  setInterval(function(){if(Date.now()-vivo>120000)ok(false);},5000);
  pintar();
}
</script>
</body>
</html>
